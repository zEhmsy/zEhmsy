name: Generate Snake Animation

on:
  schedule:
    # una volta a settimana, la domenica notte, minuto "fuori punta"
    - cron: "37 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# se una run è già in corso, la nuova la sostituisce invece di accodarsi
concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # niente actions/checkout: snk usa le API, ghaction-github-pages clona da sé
      - uses: Platane/snk@v3
        with:
          github_user_name: zehmsy
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
