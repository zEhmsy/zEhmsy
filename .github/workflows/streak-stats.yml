name: Generate Streak Stats

on:
  schedule:
    # una volta a settimana, la domenica notte, minuto "fuori punta"
    - cron: "50 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streak-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats (dark)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=zEhmsy&theme=gotham&hide_border=true
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats (light)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=zEhmsy&theme=default&hide_border=true
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak-dark.svg profile/streak-light.svg
          git commit -m "Update streak stats" || exit 0
          git push
